# Local stack: PostgreSQL + API (spec §7). Scale-out demo:
#   docker compose up --build --scale api=3
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/recipes
      DB_USERNAME: recipes
      DB_PASSWORD: recipes
      # Local demo secret [REQ-17]; override from the shell for anything shared:
      #   JWT_SECRET=... docker compose up
      JWT_SECRET: ${JWT_SECRET:-local-compose-demo-secret-at-least-32-bytes-long}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres-data:
