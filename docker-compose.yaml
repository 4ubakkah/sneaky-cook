# Local development database [REQ-12]. The api service joins in build-order
# step 8 once the Dockerfile exists; until then run the app with
# `mvn -pl api spring-boot:run` against this database.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
