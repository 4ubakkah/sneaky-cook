# Production profile — credentials, JDBC URL, and the JWT secret must come
# from the environment.
recipe:
  auth:
    # No default on purpose: prod fails fast when JWT_SECRET is missing [REQ-17].
    jwt-secret: ${JWT_SECRET}

spring:
  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
