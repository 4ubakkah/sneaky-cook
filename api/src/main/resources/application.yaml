spring:
  application:
    name: recipe-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recipes}
    username: ${DB_USERNAME:recipes}
    password: ${DB_PASSWORD:recipes}
  jpa:
    # Flyway owns the schema; Hibernate only checks the mapping against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    com.sneakycook.recipes.api.RequestLoggingFilter: INFO
