recipe:
  auth:
    # HS256 secret [REQ-17]; the default is for local development only — prod
    # overrides with a mandatory JWT_SECRET (application-prod.yaml).
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-key-that-is-at-least-32-bytes-long}
    token-ttl: 1h

spring:
  application:
    name: recipe-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recipes}
    username: ${DB_USERNAME:recipes}
    password: ${DB_PASSWORD:recipes}
  jpa:
    # Flyway owns the schema; Hibernate only checks the mapping against it.
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    com.sneakycook.recipes.api.RequestLoggingFilter: INFO
